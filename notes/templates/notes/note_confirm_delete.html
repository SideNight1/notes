<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Удалить заметку</title>
</head>
<body>
    <h1>Удалить заметку?</h1>

    <p>Удалить заметку «{{ object.title }}»?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Да, удалить</button>
    </form>

    <p><a href="{% url 'notes:list' %}">Отмена</a></p>
</body>
</html>
